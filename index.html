<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SM × Google Cloud — AI Day</title>
    <script>
      // 첫 페인트 전에 테마를 칠한다. 없으면 다크→라이트 전환이 번쩍인다.
      // src/lib/theme.ts 의 readInitialTheme() 과 같은 규칙: 저장값 있으면 그걸, 없으면 다크.
      // OS 설정(prefers-color-scheme)은 보지 않는다.
      (function () {
        try {
          var saved = localStorage.getItem('sm-theme');
          document.documentElement.dataset.theme =
            saved === 'dark' || saved === 'light' ? saved : 'dark';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
